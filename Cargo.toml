[package]
name = "blasphem"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"

[workspace]
members = [
    ".",
    "crates/blasphem-language",
    "crates/blasphem-wasm",
    "crates/blasphem-napi",
    "crates/blasphem-ffi",
    "crates/blasphem-bench",
    "crates/blasphem-train",
]
default-members = [".", "crates/blasphem-language", "crates/blasphem-wasm", "crates/blasphem-bench", "crates/blasphem-train"]
resolver = "2"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_jcs = "0.2"
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"

[[bin]]
name = "blasphem"
path = "src/main.rs"
required-features = ["embedded"]

[features]
default = ["language-detection", "embedded"]
language-detection = ["dep:blasphem-language"]
# Compiles the sparse artifacts, the lexica, and the language model into the
# binary. The wasm and napi crates turn it off and load packs at run time.
embedded = ["blasphem-language?/embedded-model"]

[dependencies]
aho-corasick = "1.1"
anyhow.workspace = true
charabia = { version = "0.9.9", default-features = false }
clap.workspace = true
csv.workspace = true
blasphem-language = { path = "crates/blasphem-language", optional = true, default-features = false }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-security = "0.1.2"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
unicode-general-category = "1.0"
unicode-script = "0.5"

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

[lints]
workspace = true
