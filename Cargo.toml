[package]
name = "toxcheck"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]
members = [".", "crates/eldc", "crates/toxcheck-wasm", "crates/toxbench", "crates/toxtrain"]
default-members = [".", "crates/eldc", "crates/toxcheck-wasm", "crates/toxbench", "crates/toxtrain"]
resolver = "2"

[features]
default = ["language-detection"]
language-detection = ["dep:eldc"]

[dependencies]
aho-corasick = "1.1"
anyhow = "1.0"
charabia = { version = "0.9.9", default-features = false }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
eldc = { path = "crates/eldc", optional = true }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
unicode-security = "0.1.2"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
unicode-general-category = "1.0"
unicode-script = "0.5"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3.20"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
