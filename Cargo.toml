[workspace.package]
# The one version every crate, npm package, wheel, and native distribution carries.
# `blasphem-train sync-versions` writes the mirrors; a test fails when one drifts.
version = "2.0.0"

[workspace]
members = [
    "crates/blasphem",
    "crates/blasphem-language",
    "crates/blasphem-wasm",
    "crates/blasphem-napi",
    "crates/blasphem-ffi",
    "crates/blasphem-jni",
    "crates/blasphem-bench",
    "crates/blasphem-train",
]
default-members = ["crates/blasphem", "crates/blasphem-language", "crates/blasphem-wasm", "crates/blasphem-bench", "crates/blasphem-train"]
resolver = "2"

[workspace.dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive"] }
csv = "=1.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_jcs = "=0.2.0"
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
thiserror = "=2.0.20"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
debug = true
strip = false

# The profile dist builds with. Identical to release, so the release binary and
# the reproduce binary share one recipe.
[profile.dist]
inherits = "release"
