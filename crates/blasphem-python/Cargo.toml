[package]
name = "blasphem-python"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"

# A workspace of its own: a Python extension module links against the
# interpreter at import time, so `cargo test --workspace` at the root must not
# try to link it. maturin builds it from packages/python/pyproject.toml.
[workspace]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
blasphem = { path = "../..", default-features = false, features = ["language-detection"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }

[lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
