[package]
name = "blasphem-python"
version = "0.1.0"
description = "Python native bindings for local toxicity checks. Blasphem hashes word and character n-grams into sparse feature vectors. A linear classifier trained offline scores them with 16-bit weights. Lexicons and context rules contribute to the verdict. Detection runs locally without neural networks or cloud inference."
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"

# A workspace of its own: a Python extension module links against the
# interpreter at import time, so `cargo test --workspace` at the root must not
# try to link it. maturin builds it from packages/python/pyproject.toml.
[workspace]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
blasphem = { path = "../blasphem", default-features = false, features = ["language-detection"] }
pyo3 = { version = "=0.29.2", features = ["extension-module", "abi3-py310"] }

[lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
