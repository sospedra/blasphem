[package]
name = "blasphem"
version.workspace = true
description = "Local toxicity checks for Rust and the command line. Blasphem hashes word and character n-grams into sparse feature vectors. A linear classifier trained offline scores them with 16-bit weights. Lexicons and context rules contribute to the verdict. Detection runs locally without neural networks or cloud inference."
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"
repository = "https://github.com/sospedra/blasphem"
readme = "../../README.md"

[[bin]]
name = "blasphem"
path = "src/main.rs"
required-features = ["embedded"]

[features]
default = ["language-detection", "embedded", "all-locales"]
language-detection = ["dep:blasphem-language"]
# Compiles the sparse artifacts, the lexica, and the language model into the
# binary. The wasm and napi crates turn it off and load packs at run time.
embedded = []
# Rule tables for external packs, without locale models or detection payloads.
all-rules = []
all-locales = ["en", "zh", "es", "ar", "ms", "pt", "fr", "hi", "ru", "ja", "de", "tr", "vi", "ko", "it"]
en = []
zh = []
es = []
ar = []
ms = []
pt = []
fr = []
hi = []
ru = []
ja = []
de = []
tr = []
vi = []
ko = []
it = []
id = ["ms"]

[dependencies]
aho-corasick = "=1.1.5"
anyhow.workspace = true
charabia = { version = "=0.9.9", default-features = false }
clap.workspace = true
csv.workspace = true
blasphem-language = { path = "../blasphem-language", optional = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-security = "=0.1.2"
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.13.3"
unicode-general-category = "=1.1.0"
unicode-script = "=0.5.8"

[dev-dependencies]
tempfile.workspace = true

# publish = false hides the binary from dist; opt it back in.
[package.metadata.dist]
dist = true

[lints]
workspace = true
