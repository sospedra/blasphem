[package]
name = "blasphem-wasm"
version.workspace = true
description = "WebAssembly bindings for local toxicity checks. Blasphem hashes word and character n-grams into sparse feature vectors. A linear classifier trained offline scores them with 16-bit weights. Lexicons and context rules contribute to the verdict. Detection runs locally without neural networks or cloud inference."
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["language-detection"]
language-detection = ["blasphem/language-detection"]

[dependencies]
blasphem = { path = "../blasphem", default-features = false, features = ["all-rules"] }
js-sys = "=0.3.104"
wasm-bindgen = "=0.2.127"

[dev-dependencies]
blasphem-language = { path = "../blasphem-language" }
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
