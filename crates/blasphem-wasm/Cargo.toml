[package]
name = "blasphem-wasm"
version.workspace = true
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["language-detection"]
language-detection = ["blasphem/language-detection"]

[dependencies]
blasphem = { path = "../..", default-features = false }
js-sys = "0.3"
wasm-bindgen = "=0.2.127"

[dev-dependencies]
blasphem-language = { path = "../blasphem-language" }
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true
