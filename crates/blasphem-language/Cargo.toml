[package]
name = "blasphem-language"
version.workspace = true
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"

[features]
default = ["embedded-model"]
# Compiles the 15-profile model into the crate. Off in the wasm and napi
# builds, which load per-language slices at run time.
embedded-model = []

[lints]
workspace = true

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
