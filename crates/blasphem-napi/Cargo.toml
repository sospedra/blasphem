[package]
name = "blasphem-napi"
version.workspace = true
description = "Node native bindings for local toxicity checks. Blasphem hashes word and character n-grams into sparse feature vectors. A linear classifier trained offline scores them with 16-bit weights. Lexicons and context rules contribute to the verdict. Detection runs locally without neural networks or cloud inference."
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
blasphem = { path = "../blasphem", default-features = false, features = ["language-detection", "all-rules"] }
napi = { version = "=3.12.2", default-features = false, features = ["napi8"] }
napi-derive = "=3.6.3"

[build-dependencies]
napi-build = "=2.4.1"

[lints]
workspace = true
