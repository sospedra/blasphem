[package]
name = "blasphem-jni"
version.workspace = true
description = "JNI bindings for local toxicity checks. Blasphem hashes word and character n-grams into sparse feature vectors. A linear classifier trained offline scores them with 16-bit weights. Lexicons and context rules contribute to the verdict. Detection runs locally without neural networks or cloud inference."
edition = "2024"
rust-version = "1.85"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
blasphem = { path = "../blasphem", default-features = false, features = ["language-detection"] }
jni = "=0.21.1"

[lints]
workspace = true
