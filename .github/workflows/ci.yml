name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  GOFLAGS: "-mod=readonly"

jobs:
  web:
    name: website (clean checkout, prebuilt WASM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the website with its Vercel command
        working-directory: apps/web
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const { buildCommand } = JSON.parse(readFileSync("vercel.json", "utf8"));
          execFileSync("/bin/sh", ["-c", `${buildCommand} --force`], { stdio: "inherit" });
          NODE

  canonical:
    name: canonical (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show the pinned toolchain
        run: |
          rustc --version
          cargo --version

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify the Go engine matches source
        run: node packages/go/scripts/build-wasm.mjs --check

      - name: Read the pinned Go version
        id: go
        run: |
          go_version=$(awk '$1 == "golang" { print $2 }' .tool-versions)
          test -n "$go_version"
          echo "version=$go_version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: packages/go/go.sum

      - name: Verify canonical packs
        run: node scripts/generate-packs.mjs --check

      - name: Verify the corpus
        run: |
          cargo run --release --locked -p blasphem-train -- corpus-verify \
            --corpus-root resources/corpus \
            --evaluation-lock crates/blasphem-train/metadata/evaluation-lock-v1.json

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify committed JavaScript WASM artifacts
        run: pnpm --filter blasphem prebuilt:check

      - name: Check dependency pins
        run: pnpm deps:check

      - name: Read the Playwright version
        id: playwright
        run: node -p "'version=' + require('./packages/javascript/node_modules/playwright/package.json').version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: pnpm --filter blasphem exec playwright install --with-deps chromium webkit

      - name: Reproduce
        run: cargo run --release --locked -p blasphem-train -- reproduce

      - name: Generate full evidence and the website snapshot
        run: pnpm evidence

      - name: Check and build the website from its committed snapshot
        run: |
          pnpm --filter web check
          pnpm --filter web build

      - name: Upload the evidence reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: reports/
          if-no-files-found: error
          retention-days: 90

  go:
    name: Go (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [minimum, pinned, current]
    env:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the Go version
        id: go
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          version=$(case "$TOOLCHAIN" in
            (minimum) awk '$1 == "go" { print $2 }' packages/go/go.mod ;;
            (pinned) awk '$1 == "golang" { print $2 }' .tool-versions ;;
            (current) echo stable ;;
            (*) exit 1 ;;
          esac)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          check-latest: ${{ matrix.toolchain == 'current' }}
          cache-dependency-path: packages/go/go.sum

      - name: Build and vet the module
        working-directory: packages/go
        run: |
          go build ./...
          go vet ./...

      - name: Judge through the Go package
        working-directory: packages/go
        run: |
          output=$(go run ./example)
          printf '%s\n' "$output"
          [[ "$output" == '{"Safe":false,'* ]]

  python:
    name: Python (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [minimum, pinned, current]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read the Python version
        id: python
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          version=$(case "$TOOLCHAIN" in
            (minimum) awk -F '"' '/^requires-python = / { sub(/^>=/, "", $2); print $2 }' packages/python/pyproject.toml ;;
            (pinned) awk '$1 == "python" { print $2 }' .tool-versions ;;
            (current) echo 3.x ;;
            (*) exit 1 ;;
          esac)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Python for the build
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .tool-versions

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/python
          key: cargo-python-${{ matrix.toolchain }}-${{ hashFiles('crates/blasphem-python/Cargo.lock', 'rust-toolchain.toml', '.tool-versions') }}

      - name: Build the Python wheels
        run: |
          python -m pip install --require-hashes -r packages/python/requirements-build.txt
          cp NOTICE LICENSE packages/python/
          python packages/python-packs/sync_packs.py
          python -m pip wheel --no-deps --no-build-isolation --config-settings=build-args=--locked \
            --wheel-dir "$RUNNER_TEMP/python-wheels" ./packages/python ./packages/python-packs

      - name: Set up Python for the compatibility check
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ steps.python.outputs.version }}
          check-latest: ${{ matrix.toolchain == 'current' }}

      - name: Install the built wheels
        run: python -m pip install --no-index --find-links "$RUNNER_TEMP/python-wheels" blasphem

      - name: Judge through the installed Python package
        run: |
          python - <<'PY'
          import blasphem

          blasphem.init(["en"])
          assert blasphem.ready()
          verdict = blasphem.judge("you are a stupid loser")
          print(verdict)
          assert verdict.safe is False and verdict.locale == "en", verdict
          blasphem.close()
          assert not blasphem.ready()
          assert blasphem.judge("you are a stupid loser").safe is True
          PY

      - name: Verify the reduced Python deployment
        run: |
          python -m blasphem export --locales en,es --output "$RUNNER_TEMP/python-export"
          PYTHONPATH="$RUNNER_TEMP/python-export" python -S - <<'PY'
          import blasphem
          blasphem.init(["en", "es"])
          assert blasphem.judge("you are a stupid loser").safe is False
          try:
              blasphem.init("all")
          except blasphem.BlasphemError as error:
              assert error.code == "BLASPHEM_LOCALE_MISSING"
          else:
              raise AssertionError("A reduced export accepted all")
          assert blasphem.ready()
          print("status=verified export=python locales=en,es isolated=true")
          PY

  macos:
    name: optional native bytes (aarch64-apple-darwin)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show the pinned toolchain
        run: |
          rustc --version
          cargo --version

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify the Go engine matches source
        run: node packages/go/scripts/build-wasm.mjs --check

      - name: Verify the corpus
        run: |
          cargo run --release --locked -p blasphem-train -- corpus-verify \
            --corpus-root resources/corpus \
            --evaluation-lock crates/blasphem-train/metadata/evaluation-lock-v1.json

      - name: Reproduce without the browser
        run: cargo run --release --locked -p blasphem-train -- reproduce --skip-browser

      - name: Record the native binary digest
        run: shasum -a 256 target/release/blasphem
