# Publishes npm packages and the Go module tag.
# cargo-dist owns the GitHub Release and the standalone binaries.
# Python, Swift, and Android publication and registry consumer checks are paused.
# Builds stay enabled. The !always() conditions disable paused jobs and steps.
#
# npm authenticates over OIDC. Go pushes its module tag with GITHUB_TOKEN.
# Paused publication steps retain their configuration for later use: PyPI OIDC,
# MAVEN_CENTRAL_USERNAME, MAVEN_CENTRAL_PASSWORD, SIGNING_KEY, SIGNING_PASSWORD,
# and BLASPHEM_SWIFT_DEPLOY_KEY.
name: Publish

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to publish, for example v2.0.0"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN_VERSION: "0.2.127"
  MATURIN_VERSION: "1.15.0"
  GOFLAGS: "-mod=readonly"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    # A manual run always proceeds. A Release run proceeds only when it passed
    # and its tag is a version tag, which excludes the packages/go/* tag below.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.event.workflow_run.head_branch }}

      - name: Resolve the tag and check it against the workspace version
        id: resolve
        env:
          TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          workspace=$(awk '/^\[workspace\.package\]/{inside=1;next} /^\[/{inside=0} inside && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          if [ "${TAG#v}" != "$workspace" ]; then
            echo "tag $TAG does not match the workspace version $workspace" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$workspace" >> "$GITHUB_OUTPUT"
          echo "status=planned tag=$TAG version=$workspace"

  packs:
    name: packs
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-packs-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Read the pinned Go version
        id: go
        run: |
          go_version=$(awk '$1 == "golang" { print $2 }' .tool-versions)
          test -n "$go_version"
          echo "version=$go_version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: packages/go/go.sum

      - name: Verify canonical packs
        run: node scripts/generate-packs.mjs --check

      - name: The canonical artifacts must be committed
        run: |
          git ls-files --error-unmatch resources/packs/manifest.json resources/packs/*.pack resources/packs/*.detect

  wasm:
    name: wasm
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version ${{ env.WASM_BINDGEN_VERSION }} --locked

      - run: pnpm install --frozen-lockfile

      - name: Build the browser package
        run: node packages/javascript/scripts/build.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blasphem-dist
          path: packages/javascript/dist
          if-no-files-found: error

  napi:
    name: napi (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, triple: aarch64-apple-darwin, runner: macos-15 }
          - { target: darwin-x64, triple: x86_64-apple-darwin, runner: macos-15 }
          - { target: linux-x64-gnu, triple: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
          - { target: linux-arm64-gnu, triple: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: linux-x64-musl, triple: x86_64-unknown-linux-musl, runner: ubuntu-24.04, musl: true }
          - { target: linux-arm64-musl, triple: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, musl: true }
          - { target: win32-x64-msvc, triple: x86_64-pc-windows-msvc, runner: windows-2022 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions

      - name: Install the musl toolchain
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Add the Rust target
        run: rustup target add ${{ matrix.triple }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/npm-node
          key: cargo-napi-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Write the platform manifest
        run: node packages/node/scripts/npm-dirs.mjs

      - name: Build the engine
        # A musl cdylib links statically by default and then will not load as a
        # Node addon, so musl builds turn crt-static off.
        env:
          RUSTFLAGS: ${{ matrix.musl && '-C target-feature=-crt-static' || '' }}
        run: node packages/node/scripts/build.mjs --target ${{ matrix.target }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: napi-${{ matrix.target }}
          path: packages/node/npm/${{ matrix.target }}
          if-no-files-found: error

  cli:
    name: cli
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions

      - name: Write the platform manifests
        run: node packages/cli/scripts/npm-dirs.mjs

      - name: Fill the platform packages from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node packages/cli/scripts/fetch-release.mjs --tag ${{ needs.plan.outputs.tag }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-npm
          path: packages/cli/npm
          if-no-files-found: error

  react-native:
    name: react-native
    needs: plan
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Add the mobile Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/ffi
          key: cargo-ffi-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - run: pnpm install --frozen-lockfile

      - name: Build the XCFramework and the Android archives
        run: node packages/react-native/scripts/rust.mjs

      - name: Build the TypeScript
        run: node packages/react-native/scripts/build.mjs

      - name: Collect the artifacts
        run: |
          set -euo pipefail
          tar -czf react-native.tar.gz -C packages/react-native \
            dist ios/BlasphemFFI.xcframework android/libs cpp/blasphem.h \
            ios/BlasphemFileIO.swift ios/BlasphemDownloadStore.swift \
            android/src/main/java/com/margelo/nitro/blasphem/BlasphemRemoteStore.kt \
            android/src/main/java/com/margelo/nitro/blasphem/Release.generated.kt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: react-native
          path: react-native.tar.gz
          if-no-files-found: error

  npm:
    name: npm
    needs: [plan, packs, wasm, napi, cli, react-native]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions
          registry-url: https://registry.npmjs.org

      - name: Use an npm that speaks Trusted Publishing
        run: |
          npm install --global npm@11.16.0
          npm --version

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: blasphem-dist, path: packages/javascript/dist }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { pattern: napi-*, path: packages/node/npm, merge-multiple: false }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: cli-npm, path: packages/cli/npm }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: react-native, path: . }

      - name: Place the artifacts
        run: |
          set -euo pipefail
          # download-artifact names each napi directory after its artifact.
          for directory in packages/node/npm/napi-*; do
            target="${directory#packages/node/npm/napi-}"
            mkdir -p "packages/node/npm/$target"
            cp -R "$directory"/. "packages/node/npm/$target/"
            rm -rf "$directory"
          done
          tar -xzf react-native.tar.gz -C packages/react-native
          chmod +x packages/cli/npm/*/bin/blasphem || true
          ls -l packages/node/npm/*/*.node
          ls -l packages/cli/npm/*/bin/*

      - name: Publish
        run: node scripts/publish-npm.mjs

  wheels:
    name: wheels (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, triple: aarch64-apple-darwin, runner: macos-15 }
          - { target: darwin-x64, triple: x86_64-apple-darwin, runner: macos-15 }
          - { target: linux-x64-gnu, triple: x86_64-unknown-linux-gnu, runner: ubuntu-24.04, manylinux: auto }
          - { target: linux-arm64-gnu, triple: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, manylinux: auto }
          - { target: linux-x64-musl, triple: x86_64-unknown-linux-musl, runner: ubuntu-24.04, manylinux: musllinux_1_2 }
          - { target: linux-arm64-musl, triple: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, manylinux: musllinux_1_2 }
          - { target: win32-x64-msvc, triple: x86_64-pc-windows-msvc, runner: windows-2022 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .tool-versions

      - name: Copy the Python notice
        shell: bash
        run: cp NOTICE LICENSE packages/python/

      - name: Build the wheel
        # pyo3 abi3-py310 means one wheel per platform covers every supported Python.
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.triple }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: packages/python
          maturin-version: ${{ env.MATURIN_VERSION }}
          args: --release --locked --out dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.target }}
          path: packages/python/dist
          if-no-files-found: error

  sdists:
    name: sdists
    needs: [plan, packs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .tool-versions

      - name: Copy the Python notice
        run: cp NOTICE LICENSE packages/python/

      - name: Build the blasphem source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          working-directory: packages/python
          maturin-version: ${{ env.MATURIN_VERSION }}
          args: --out dist

      - name: Build the blasphem-packs wheel and source distribution
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r packages/python/requirements-build.txt
          python packages/python-packs/sync_packs.py
          python -m build --no-isolation --outdir packages/python-packs/dist packages/python-packs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist-blasphem
          path: packages/python/dist
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-blasphem-packs
          path: packages/python-packs/dist
          if-no-files-found: error

  pypi:
    name: pypi
    # Pause publication only. Wheel and source-distribution builds stay enabled.
    if: ${{ !always() }}
    needs: [plan, wheels, sdists]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: wheel-*
          path: blasphem
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sdist-blasphem
          path: blasphem
          merge-multiple: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-blasphem-packs
          path: blasphem-packs

      - run: ls -l blasphem blasphem-packs

      - name: Publish blasphem
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: blasphem
          skip-existing: true

      - name: Publish blasphem-packs
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: blasphem-packs
          skip-existing: true

  go:
    name: go
    needs: [plan, packs]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
          fetch-depth: 0

      - name: Read the Go version
        id: go
        run: |
          version=$(awk '$1 == "golang" { print $2 }' .tool-versions)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ steps.go.outputs.version }}
          cache-dependency-path: packages/go/go.sum

      - name: The embedded core must be committed
        # `go:embed` reads the git tree, so the module proxy serves whatever is
        # tagged. An untracked wasm file makes `go get` fail for everyone.
        run: |
          set -euo pipefail
          if ! git ls-files --error-unmatch packages/go/blasphem_ffi.wasm >/dev/null 2>&1; then
            echo "packages/go/blasphem_ffi.wasm is not tracked; go get would fail" >&2
            exit 1
          fi
          node packages/go/scripts/build-locales.mjs --check
          git ls-files --error-unmatch packages/go/locales/*/*.pack packages/go/locales/*/*.detect

      - name: Build and vet the module
        run: |
          set -euo pipefail
          cd packages/go
          CGO_ENABLED=0 go build ./...
          go vet ./...

      - name: Tag the module
        # The push uses GITHUB_TOKEN, so GitHub raises no event for it and
        # release.yml does not fire a second time on this tag.
        env:
          TAG: packages/go/v${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$TAG"
            git show "FETCH_HEAD:packages/go/NOTICE" | cmp NOTICE -
            echo "status=exists tag=$TAG"
            exit 0
          fi
          cp NOTICE packages/go/NOTICE
          git add --force packages/go/NOTICE
          tree=$(git write-tree)
          commit=$(git -c user.name="blasphem publish" -c user.email="publish@blasphem.sospedra.me" \
            commit-tree "$tree" -p "${{ needs.plan.outputs.tag }}" -m "Package Go notice for $TAG")
          git show "$commit:packages/go/NOTICE" | cmp NOTICE -
          git tag "$TAG" "$commit"
          git push origin "$TAG"
          echo "status=tagged tag=$TAG"

      - name: Warm the module proxy
        env:
          GOPROXY: https://proxy.golang.org
          GOFLAGS: -mod=mod
        run: |
          set -euo pipefail
          module=$(go -C packages/go list -m)
          cd "$(mktemp -d)"
          go mod init warm
          go get "$module@v${{ needs.plan.outputs.version }}"

  swift:
    name: swift
    needs: [plan, packs]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions

      - name: Add the Apple Rust targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/ffi
          key: cargo-ffi-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build the XCFramework
        run: node packages/apple/scripts/xcframework.mjs

      - name: Build the local Swift package
        run: |
          node packages/apple/scripts/prepare.mjs
          swift build --package-path packages/apple

      - name: Upload the XCFramework to the Release
        if: ${{ !always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ needs.plan.outputs.tag }} packages/apple/BlasphemFFI.xcframework.zip --clobber

      - name: Compute the checksum
        id: checksum
        run: echo "sum=$(swift package compute-checksum packages/apple/BlasphemFFI.xcframework.zip)" >> "$GITHUB_OUTPUT"

      - name: Install the deploy key
        if: ${{ !always() }}
        env:
          DEPLOY_KEY: ${{ secrets.BLASPHEM_SWIFT_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/blasphem_swift
          chmod 600 ~/.ssh/blasphem_swift
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/blasphem_swift -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Publish sospedra/blasphem-swift
        if: ${{ !always() }}
        run: |
          node packages/apple/scripts/distribution.mjs \
            --version ${{ needs.plan.outputs.version }} \
            --checksum ${{ steps.checksum.outputs.sum }} \
            --repo git@github.com:sospedra/blasphem-swift.git

  android:
    name: android
    needs: [plan, packs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .tool-versions

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version-file: .tool-versions

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Add the Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-jni-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Build the JNI libraries
        # Google Play requires 16 KB page alignment for apps targeting API 35 and later.
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
        run: |
          set -euo pipefail
          cargo ndk --platform 24 -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o packages/android/engine/src/main/jniLibs build --release --locked -p blasphem-jni
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for abi in arm64-v8a x86_64; do
            "$readelf" -l "packages/android/engine/src/main/jniLibs/$abi/libblasphem_jni.so" \
              | awk -v abi="$abi" '/^ *LOAD/ && $NF != "0x4000" { print abi ": LOAD segment not aligned to 16 KB: " $0; bad = 1 } END { exit bad }'
          done

      - name: Sync the packs into the asset modules
        run: node packages/android/scripts/sync-packs.mjs

      - name: Build every AAR and the Gradle plugin
        working-directory: packages/android
        run: >-
          ./gradlew assembleRelease :gradle-plugin:build
          :gradle-plugin:generatePomFileForPluginMavenPublication
          :gradle-plugin:generatePomFileForBlasphemPluginMarkerMavenPublication
          --no-daemon

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Prepare a local Android consumer
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, mkdtempSync, readFileSync, writeFileSync } from "node:fs";
          import { resolve } from "node:path";
          const root = process.cwd();
          const scratch = mkdtempSync(resolve(process.env.RUNNER_TEMP, "blasphem-android-"));
          const android = resolve(root, "packages/android");
          const { version } = JSON.parse(readFileSync("packages/javascript/package.json", "utf8"));
          const manifest = JSON.parse(readFileSync("resources/packs/manifest.json", "utf8"));
          const codes = Object.keys(manifest.files).filter(name => name.endsWith(".pack")).map(name => name.split(".")[0]);
          const substitutions = codes.flatMap(code => ["pack", "detect"].map(kind =>
            `substitute(module("me.sospedra.blasphem:blasphem-${kind}-${code}")).using(project(":packs:${code}:${kind}"))`));
          const files = {
            "settings.gradle.kts": `
              pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
              dependencyResolutionManagement { repositories { google(); mavenCentral() } }
              rootProject.name = "BlasphemConsumer"
              include(":app")
              includeBuild(${JSON.stringify(android)}) { dependencySubstitution {
                substitute(module("me.sospedra.blasphem:blasphem")).using(project(":engine"))
                ${substitutions.join("\n")}
              } }
            `,
            "build.gradle.kts": `
              buildscript { dependencies { classpath(files(${JSON.stringify(`${android}/gradle-plugin/build/libs/gradle-plugin-${version}.jar`)})) } }
              plugins {
                id("com.android.application") version "8.13.1" apply false
                id("org.jetbrains.kotlin.android") version "2.2.21" apply false
              }
            `,
            "app/build.gradle.kts": `
              plugins {
                id("com.android.application")
                id("org.jetbrains.kotlin.android")
                id("me.sospedra.blasphem")
              }
              android {
                namespace = "me.sospedra.blasphem.consumer"
                compileSdk = 35
                defaultConfig { applicationId = "me.sospedra.blasphem.consumer"; minSdk = 24; targetSdk = 35 }
                compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
                kotlinOptions { jvmTarget = "17" }
              }
              blasphem { locales.set(listOf("en", "es")); assets.set(providers.gradleProperty("delivery").orElse("bundled")) }
            `,
            "app/src/main/AndroidManifest.xml": `<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light.NoActionBar"><activity android:name=".MainActivity" android:exported="true" /></application></manifest>`,
            "app/src/main/kotlin/me/sospedra/blasphem/consumer/MainActivity.kt": `
              package me.sospedra.blasphem.consumer
              import android.app.Activity
              import android.os.Bundle
              import android.util.Log
              import kotlinx.coroutines.CoroutineScope
              import kotlinx.coroutines.Dispatchers
              import kotlinx.coroutines.launch
              import me.sospedra.blasphem.Judge
              class MainActivity : Activity() {
                override fun onCreate(state: Bundle?) {
                  super.onCreate(state)
                  CoroutineScope(Dispatchers.Default).launch {
                    try {
                      Judge.create(this@MainActivity).use { judge ->
                        val verdict = judge.judge("you are a stupid loser")
                        check(!verdict.safe && verdict.locale == "en" && verdict.score == 0.95)
                        Log.i("BLASPHEM", "status=verified config_only=true verdict=" + verdict)
                      }
                    } catch (error: Throwable) { Log.e("BLASPHEM", "status=failed", error) }
                    runOnUiThread { finish() }
                  }
                }
              }
            `,
          };
          for (const [name, source] of Object.entries(files)) {
            const path = resolve(scratch, name);
            mkdirSync(resolve(path, ".."), { recursive: true });
            writeFileSync(path, source);
          }
          writeFileSync(process.env.GITHUB_ENV, `ANDROID_CONSUMER=${scratch}\n`, { flag: "a" });
          NODE

      - name: Run the consuming Android app
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: packages/android
          script: |
            ./gradlew -p "$ANDROID_CONSUMER" installDebug --no-daemon
            adb shell am start -W -n me.sospedra.blasphem.consumer/.MainActivity
            for attempt in $(seq 1 30); do
              output=$(adb logcat -d -s BLASPHEM:I)
              if [[ "$output" == *"status=verified config_only=true"* ]]; then printf '%s\n' "$output"; break; fi
              if [[ "$output" == *"status=failed"* ]] || [[ "$attempt" == 30 ]]; then printf '%s\n' "$output"; exit 1; fi
              sleep 1
            done

      - name: Check the remote consumer APK
        working-directory: packages/android
        run: |
          ./gradlew -p "$ANDROID_CONSUMER" assembleDebug -Pdelivery=remote --no-daemon
          entries=$(unzip -Z1 "$ANDROID_CONSUMER/app/build/outputs/apk/debug/app-debug.apk")
          if [[ "$entries" == *".pack"* ]] || [[ "$entries" == *".detect"* ]]; then echo "Remote APK contains language data"; exit 1; fi
          [[ "$entries" == *"assets/blasphem/bundle.json"* ]]
          [[ "$entries" == *"lib/x86_64/libblasphem_jni.so"* ]]
          echo "status=verified remote_packs=0 native_engine=bundled"

      - name: Publish to the Central Portal
        if: ${{ !always() }}
        working-directory: packages/android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAllPublicationsToMavenCentralRepository --no-daemon --no-configuration-cache

  verify:
    name: verify (${{ matrix.runner }})
    needs: [plan, npm]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2022]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.plan.outputs.tag }}
          path: source

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: source/.tool-versions

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ !always() }}
        with:
          python-version-file: source/.tool-versions

      - name: Judge through the published command-line binary
        shell: bash
        # `judge` exits 0 when the text is safe and 1 when it is not, so both
        # codes are part of the contract this step checks.
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          npx --yes "blasphem@$VERSION" judge "good morning everyone"
          set +e
          npx --yes "blasphem@$VERSION" judge "you are a stupid loser"
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "judge returned $code for an unsafe text, expected 1" >&2
            exit 1
          fi

      - name: Judge through the published wheel
        if: ${{ !always() }}
        shell: bash
        # The runtime resolves its exact internal data dependency automatically.
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install "blasphem==$VERSION"
          python -c "import blasphem; blasphem.init(['en']); v = blasphem.judge('you are a stupid loser'); print(v); assert v.safe is False, v"

      - name: Judge through the published Swift package
        if: ${{ !always() }}
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          scratch=$(mktemp -d)
          mkdir -p "$scratch/Sources/Scratch"
          cat > "$scratch/Package.swift" <<EOF
          // swift-tools-version: 5.9
          import PackageDescription
          let package = Package(
              name: "Scratch",
              platforms: [.macOS(.v12)],
              dependencies: [.package(url: "https://github.com/sospedra/blasphem-swift.git", exact: "$VERSION")],
              targets: [
                  .executableTarget(name: "Scratch", dependencies: [
                      .product(name: "Blasphem", package: "blasphem-swift"),
                  ], plugins: [.plugin(name: "BlasphemAssets", package: "blasphem-swift")]),
              ]
          )
          EOF
          printf '%s\n' '{"locales":["en","es"]}' > "$scratch/blasphem.json"
          cat > "$scratch/Sources/Scratch/main.swift" <<'EOF'
          import Blasphem
          let judge = try await Judge.create(grawlix: true)
          let verdict = try judge.judge("you are a stupid loser")
          print(verdict)
          guard verdict.safe == false, verdict.locale == "en" else { fatalError("unexpected verdict") }
          EOF
          cd "$scratch" && swift run Scratch

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: ${{ !always() }}
        with:
          distribution: temurin
          java-version-file: source/.tool-versions

      - name: Resolve the published Android artifacts
        if: ${{ !always() }}
        # Central publishes within minutes but promises no bound; the poll stops
        # at 30 minutes and a rerun of this job is the remedy.
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          base="https://repo1.maven.org/maven2/me/sospedra/blasphem"
          for attempt in $(seq 1 60); do
            if curl --silent --fail --head "$base/blasphem/$VERSION/blasphem-$VERSION.pom" >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then echo "blasphem $VERSION is not on Maven Central after 30 minutes" >&2; exit 1; fi
            sleep 30
          done
          scratch=$(mktemp -d)
          cat > "$scratch/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "scratch"
          EOF
          cat > "$scratch/build.gradle.kts" <<EOF
          plugins {
              id("com.android.application") version "8.13.1"
              id("me.sospedra.blasphem") version "$VERSION"
          }
          android { namespace = "me.sospedra.blasphem.scratch"; compileSdk = 35; defaultConfig { minSdk = 24 } }
          blasphem { locales.set(listOf("es")) }
          // AGP creates the variant configurations after evaluation, so resolve inside the task.
          tasks.register("listAars") {
              doLast {
                  val aars = configurations.getByName("releaseRuntimeClasspath").incoming.artifactView {
                      attributes { attribute(Attribute.of("artifactType", String::class.java), "aar") }
                  }.files
                  aars.forEach { println(it.absolutePath) }
              }
          }
          EOF
          source/packages/android/gradlew -p "$scratch" -q listAars --no-daemon > "$scratch/aars.txt"
          cat "$scratch/aars.txt"
          for aar in $(cat "$scratch/aars.txt"); do unzip -l "$aar"; done > "$scratch/entries.txt"
          for entry in jni/arm64-v8a/libblasphem_jni.so jni/armeabi-v7a/libblasphem_jni.so jni/x86_64/libblasphem_jni.so assets/blasphem/es.pack; do
            grep -q " $entry\$" "$scratch/entries.txt" || { echo "$entry is missing from the published AARs" >&2; exit 1; }
          done
          echo "status=verified aars=$(wc -l < "$scratch/aars.txt")"
