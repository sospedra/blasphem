POM_NAME=blasphem
POM_DESCRIPTION=Local toxicity checks for Android through the Rust engine and JNI. Blasphem hashes word and character n-grams into sparse feature vectors. A linear classifier trained offline scores them with 16-bit weights. Lexicons and context rules contribute to the verdict. Detection runs locally without neural networks or cloud inference.
