POM_DESCRIPTION=Bill of materials pinning the blasphem engine and data for 16 supported languages to one version. Blasphem hashes word and character n-grams into sparse feature vectors. A linear classifier trained offline scores them with 16-bit weights. Lexicons and context rules contribute to the verdict. Detection runs locally without neural networks or cloud inference.
