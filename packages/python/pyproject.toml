[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "blasphem"
version = "1.0.0"
description = "Local toxicity checks for Python. Blasphem hashes word and character n-grams into sparse feature vectors. A linear classifier trained offline scores them with 16-bit weights. Lexicons and context rules contribute to the verdict. Detection runs locally without neural networks or cloud inference."
readme = "README.md"
license = "Apache-2.0"
license-files = ["NOTICE"]
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Operating System :: OS Independent",
]

[tool.maturin]
manifest-path = "../../crates/blasphem-python/Cargo.toml"
python-source = "python"
module-name = "blasphem._native"
features = ["pyo3/extension-module"]
